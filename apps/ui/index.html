<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to a
         non-zero value on notched devices; the insets are consumed through the
         --ui-safe-* tokens (packages/design-tokens/src/ui-viewport.css). -->
    <meta
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
      name="viewport"
    >
    <title>Engenty</title>

    <!-- Animated APNG favicon (Chrome, Firefox, Safari, Edge) -->
    <link href="/favicon.apng" rel="icon" type="image/apng">
    <!-- Dark-mode-aware SVG favicon (auto-switches light/dark) -->
    <link href="/favicon.svg" rel="icon" type="image/svg+xml">
    <!-- Legacy ICO fallback -->
    <link href="/favicon.ico" rel="icon" sizes="32x32" type="image/x-icon">
    <!-- iOS home-screen icon -->
    <link href="/apple-touch-icon.png" rel="apple-touch-icon">
    <!-- PWA manifest -->
    <link href="/manifest.webmanifest" rel="manifest">
    <!-- Browser chrome theme color (light + dark) -->
    <meta
      content="#e0531b"
      media="(prefers-color-scheme: light)"
      name="theme-color"
    >
    <meta
      content="#1a1a1a"
      media="(prefers-color-scheme: dark)"
      name="theme-color"
    >
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
    <script>
    "use strict";
    // Web push (N2). Only the browser gets the service worker: the native
    // shells deliver notifications through their own plugin, and a second
    // registered SW would double-notify.
    //
    // Do NOT go back to sniffing location.protocol. That test happens to hold
    // on iOS/macOS (origin `tauri://localhost`) but fails OPEN on Android,
    // whose Tauri webview serves from `http://tauri.localhost` — the SW would
    // register inside the app and race the native push plugin. Detect the
    // shell itself; `__TAURI_INTERNALS__` is injected before any page script
    // (same probe as isDesktopShell() in src/desktop/desktop-runtime.ts).
    const inNativeShell = "__TAURI_INTERNALS__" in window;
    if (
      !inNativeShell &&
      "serviceWorker" in navigator &&
      /^https?:$/.test(location.protocol)
    ) {
      navigator.serviceWorker.register("/sw.js").catch(() => {});
    }
    </script>
  </body>
</html>
