<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>Engenty</title>
  <!--
    Engenty favicon — dark-mode-aware, static.
    Based on the Ember blob avatar (character 0).
    The SVG embeds @media (prefers-color-scheme: dark) for auto-switching.
  -->
  <style>
  /* Light-mode defaults */
  .e-body {
    fill: #e0531b;
  }
  .e-ring {
    fill: none;
    stroke: #fff;
    stroke-width: 1.6;
  }
  .e-pupil {
    fill: #fff;
  }
  .e-bub {
    fill: #e0531b;
  }
  .e-shad {
    fill: rgba(0, 0, 0, 0.09);
  }

  /* Dark-mode overrides — lighter ember pops on dark chrome */
  @media (prefers-color-scheme: dark) {
    .e-body {
      fill: #f07040;
    }
    .e-ring {
      stroke: rgba(255, 255, 255, 0.88);
    }
    .e-pupil {
      fill: rgba(255, 255, 255, 0.88);
    }
    .e-bub {
      fill: #f07040;
    }
    .e-shad {
      fill: rgba(255, 255, 255, 0.04);
    }
  }
  </style>

  <!-- Ground shadow -->
  <ellipse class="e-shad" cx="16" cy="27.5" rx="7.5" ry="1.3" />

  <!-- Body — dome/bell silhouette matching the CSS blob-shape border-radius -->
  <path
    class="e-body"
    d="M16 7C8 7 4 7 4 16C4 23 9 26 16 26C23 26 28 23 28 16C28 7 24 7 16 7Z"
  />

  <!-- Eye — stroked ring + offset pupil (signature "alive" look) -->
  <circle class="e-ring" cx="16" cy="15" r="3" />
  <circle class="e-pupil" cx="16.5" cy="14.7" r="1.3" />

  <!-- Accent bubbles (character 0 — ember) -->
  <circle class="e-bub" cx="22" cy="5.5" opacity="0.55" r="1.5" />
  <circle class="e-bub" cx="19.5" cy="3.5" opacity="0.35" r="1" />
</svg>
