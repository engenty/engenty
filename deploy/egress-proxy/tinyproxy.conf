# Sandbox egress proxy.
#
# The one route out for a sandbox running model-generated code. Every request
# is logged with its destination, and `FilterDefaultDeny` means a host that is
# not in `filter` does not resolve — so an allowlist is an allowlist, not a
# suggestion.
#
# Only containers on the `engenty-egress` docker network can reach this at all;
# it publishes no port.

Port 8888
Listen 0.0.0.0
Timeout 600

# tinyproxy refuses to start without a child pool, so these are required, not
# tuning. Sized for the sandbox ceiling rather than for web traffic: the clients
# are the handful of containers the admission gate lets run at once.
StartServers 2
MinSpareServers 2
MaxSpareServers 8
MaxClients 64

# Drop privileges after binding the port. Without these tinyproxy warns and
# stays root, which is the wrong thing for the one process every sandbox talks
# through.
User nobody
Group nogroup

# Every client on this network. The network IS the access control — a container
# only joins it when its agent declared `network: "egress"`.
Allow 0.0.0.0/0

# The allowlist. `FilterDefaultDeny Yes` inverts the file's meaning from
# "block these" to "allow only these", which is the only safe direction for a
# host reachable by code a model wrote.
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterURLs Off
FilterDefaultDeny Yes

# CONNECT is what makes HTTPS work through a proxy; without these two ports the
# allowlist would be moot because nothing encrypted could pass at all.
ConnectPort 443
ConnectPort 563

LogLevel Info
