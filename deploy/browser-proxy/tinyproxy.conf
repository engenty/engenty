# User-browser egress proxy.
#
# The one route out for a user's browser container (`engenty-browser-*`). The
# browser is, by design, the agent's open-internet path — it exists only when
# a user asked for one and acts in that user's name — so this proxy is an OPEN
# proxy with a blocklist, not the sandbox proxy's allowlist. What it adds is
# the trail: `LogLevel Connect` records every host the browser reached, and
# `filter` keeps it off our own containers and the cloud metadata range.
#
# Only containers on the `engenty-browser-egress` docker network reach this;
# it publishes no port.

Port 8888
Listen 0.0.0.0
Timeout 600

StartServers 2
MinSpareServers 2
MaxSpareServers 8
# One browser per user per space, a handful of connections each.
MaxClients 128

User nobody
Group nogroup

# Every client on this network. The network IS the access control — only a
# user browser container joins it.
Allow 0.0.0.0/0

# The BLOCKLIST. `FilterDefaultDeny No` keeps the file's plain meaning — hosts
# listed are refused, everything else passes — which is the right direction
# for a browser a user is logged into: the user decides where it goes.
Filter "/etc/tinyproxy/filter"
FilterExtended On
FilterURLs Off
FilterDefaultDeny No

# CONNECT is what makes HTTPS work through a proxy.
ConnectPort 443
ConnectPort 563
ConnectPort 8443

# Connect = one line per CONNECT/request with the destination host: the
# operator's answer to "where did this browser go".
LogLevel Connect
