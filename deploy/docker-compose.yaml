# Engenty production stack for Coolify / Docker Compose.
# Build context is the repository root (parent of deploy/).
#
# Usage:
#   cp deploy/.env.example deploy/.env
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env build
#   docker compose -f deploy/docker-compose.yaml --env-file deploy/.env up -d
#
# Optional profiles:
#   docker compose -f deploy/docker-compose.yaml --profile studio up -d
#   docker compose -f deploy/docker-compose.yaml --profile docs up -d

name: engenty

services:
  engenty-edge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.edge
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_ENGENTY_AI_BASE_URL: ${PUBLIC_APP_URL}
    container_name: engenty-edge
    restart: unless-stopped
    # Pin which network's IP Traefik targets: under Coolify this container sits
    # on several networks and Traefik picks one arbitrarily per container start
    # — landing on the internal `engenty` network (which the proxy can't reach)
    # 504s the whole site. Inert outside Coolify/Traefik setups.
    labels:
      - traefik.docker.network=coolify
    ports:
      - "${EDGE_PUBLISH_PORT:-8787}:8787"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      ENGENTY_PROD_GATEWAY: "1"
      ENGENTY_GATEWAY_UI_ROOT: /app/apps/ui/dist
      # The Manage admin portal (apps/manage) is closed-source and not part of
      # this repository, so the gateway's /manage route stays disabled. Trees
      # that vendor the app can flip this on and extend Dockerfile.edge.
      ENGENTY_GATEWAY_MANAGE_ENABLED: ${ENGENTY_GATEWAY_MANAGE_ENABLED:-false}
      ENGENTY_GATEWAY_DOCS_ENABLED: ${ENGENTY_GATEWAY_DOCS_ENABLED:-false}
      ENGENTY_GATEWAY_STUDIO_ENABLED: ${ENGENTY_GATEWAY_STUDIO_ENABLED:-false}
      ENGENTY_GATEWAY_STUDIO_BASIC_AUTH: ${ENGENTY_GATEWAY_STUDIO_BASIC_AUTH:-}
      ENGENTY_GATEWAY_AI_URL: http://engenty-ai:8790
      ENGENTY_GATEWAY_DOCS_URL: http://engenty-docs:3000
      ENGENTY_GATEWAY_STUDIO_URL: http://engenty-studio:43111
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      ENGENTY_SECURITY_JWT_SECRET: ${ENGENTY_SECURITY_JWT_SECRET}
      # Registers the agent escalation policy (role grants ∪ goal grants;
      # escalate on the gap). On by default: it was written as the gate that
      # governs agent runs, but shipped registered nowhere.
      ENGENTY_AGENT_ESCALATION: ${ENGENTY_AGENT_ESCALATION:-true}
      GOTENBERG_URL: http://gotenberg:3000
      CORS_ORIGIN: ${PUBLIC_APP_URL}
      ENGENTY_UI_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_API_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_AI_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_DOCS_BASE_URL: ${PUBLIC_APP_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # engenty Apps — the modules/engenty-apps plugin runs HERE, in core, not
      # only in apps/ai: it is what builds and calls deployed apps. Without
      # these two it logs "ENGENTY_APP_HOST_URL unset" at boot and every app
      # build fails, while app-host itself sits there perfectly healthy.
      ENGENTY_APP_HOST_URL: http://engenty-app-host:8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
    depends_on:
      engenty-migrate:
        condition: service_completed_successfully
      engenty-ai:
        condition: service_healthy
      gotenberg:
        condition: service_started
    networks:
      - engenty

  # One-shot migration runner — see docker-compose.prebuilt.yaml for the full
  # note. No-op unless SUPABASE_DB_URL is set.
  engenty-migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.migrate
    container_name: engenty-migrate
    restart: "no"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
    networks:
      - engenty

  engenty-ai:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.ai
    container_name: engenty-ai
    restart: unless-stopped
    depends_on:
      engenty-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8790
      ENGENTY_CORE_BASE_URL: http://engenty-edge:8787
      ENGENTY_CORS_ORIGINS: ${ENGENTY_CORS_ORIGINS}
      ENGENTY_WORKSPACE_FS: remote
      ENGENTY_WORKSPACE_FS_PROVIDER: supabase
      # The agent sandbox is Docker-only (no local fallback); a missing/broken
      # Docker setup is expected to error loudly rather than silently degrade.
      ENGENTY_SANDBOX_PROVIDER: docker
      ENGENTY_SANDBOX_DOCKER_IMAGE: ${ENGENTY_SANDBOX_DOCKER_IMAGE:-engenty-sandbox:latest}
      # MUST equal the host bind path below: when ENGENTY_SANDBOX_PROVIDER=docker
      # the staging dir is bind-mounted into sibling containers via the host
      # Docker daemon, and `-v` sources resolve on the host — so the in-container
      # path has to match the host path 1:1 (a named volume would not work).
      ENGENTY_LOCAL_WORKSPACE_ROOT: ${ENGENTY_SANDBOX_HOST_DIR:-/opt/engenty/sandboxes}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      # Direct Postgres connection for the Mastra store (inbox notifications,
      # suspend/resume) and the notification pg pools (web push, email).
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      # Web push (VAPID). Unset ⇒ push channel off (config reports null).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AI service identity — the durable credential apps/ai exchanges at core
      # for 15-min tokens (scheduler, task dispatcher, remote channels).
      # `engenty service-token create --name ai-service`.
      ENGENTY_AI_SERVICE_SECRET: ${ENGENTY_AI_SERVICE_SECRET:-}
      # engenty Apps. Reached over internal Docker DNS only; app-host publishes
      # no port and is not a gateway target.
      ENGENTY_APP_HOST_URL: http://engenty-app-host:8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
    volumes:
      # Mirror the host sandbox dir 1:1 (same path inside and outside the
      # container) so sibling sandbox containers can bind-mount staging dirs.
      # Literal path (no ${ENGENTY_SANDBOX_HOST_DIR}) — Coolify's compose parser
      # rejects variable substitution in volume definitions. If you change the
      # sandbox dir, edit this line AND set ENGENTY_SANDBOX_HOST_DIR to match.
      - /opt/engenty/sandboxes:/opt/engenty/sandboxes
      # Required when ENGENTY_SANDBOX_PROVIDER=docker — spawns sibling containers via Docker Engine.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - engenty

  # Runtime for tenant-authored engenty Apps. Serves NO public traffic: no
  # published port, no gateway target, no Traefik labels. Only engenty-ai talks
  # to it, over internal Docker DNS with a shared secret. Apps themselves are
  # rendered in opaque-origin iframes in the SPA, so they never get an origin
  # that could read the platform session — see PLAN-engenty-apps.md §2.3.
  engenty-app-host:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app-host
    container_name: engenty-app-host
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ENGENTY_APP_HOST_PORT: 8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
    # Bounds on tenant-authored code. agentos-apps exposes replica scaling but
    # no per-app memory knob, so the container is where the ceiling lives: each
    # app VM is ~22 MB plus the two native child processes. Raise deliberately.
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 4096
    volumes:
      # RivetKit's engine store lives at $HOME/.rivetkit (HOME=/data in the
      # image). Named volume, not a bind: nothing on the host needs to read it,
      # but losing it drops every deployed app release.
      - engenty-app-host-data:/data
    networks:
      - engenty

  # Build-only service for the agent sandbox runtime image. It is NOT a network
  # service: the image is launched by the HOST Docker daemon as sibling
  # containers (via the mounted docker.sock on engenty-ai), never inside this
  # network. We deliberately keep it OUT of a profile so a plain
  # `docker compose build` produces `engenty-sandbox:latest` on the host
  # (profile-gated services are skipped by `build`). `command: ["true"]` +
  # `restart: "no"` make it a harmless no-op if `up` ever starts it (it exits 0).
  engenty-sandbox:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.sandbox
    image: ${ENGENTY_SANDBOX_DOCKER_IMAGE:-engenty-sandbox:latest}
    command: ["true"]
    restart: "no"
    networks:
      - engenty

  gotenberg:
    image: gotenberg/gotenberg:8
    container_name: engenty-gotenberg
    restart: unless-stopped
    networks:
      - engenty

  engenty-studio:
    profiles:
      - studio
    build:
      context: ..
      dockerfile: deploy/Dockerfile.studio
    container_name: engenty-studio
    restart: unless-stopped
    environment:
      MASTRA_STUDIO_BASE_PATH: /studio
      MASTRA_SKIP_PEERDEP_CHECK: "1"
      MASTRA_AI_HOST: engenty-ai
    depends_on:
      engenty-ai:
        condition: service_healthy
    networks:
      - engenty

  engenty-docs:
    profiles:
      - docs
    build:
      context: ..
      dockerfile: deploy/Dockerfile.docs
    container_name: engenty-docs
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_DOCS_SITE_URL: ${PUBLIC_APP_URL}
    networks:
      - engenty

networks:
  engenty:
    driver: bridge

volumes:
  # Durable RivetKit engine store for apps/app-host (deployed app releases).
  engenty-app-host-data:
