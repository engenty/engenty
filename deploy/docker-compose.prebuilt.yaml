# Engenty production stack — prebuilt-image variant for Coolify.
#
# The tenant-locked server lane needs a signing key this project's PostgREST
# trusts. On Supabase Cloud after the JWT-signing-keys migration there is no
# shared secret to sign with, so ENGENTY_SERVER_LANE_PRIVATE_KEY +
# ENGENTY_SERVER_LANE_KEY_ID must name an EC P-256 key imported into the
# project's signing keys (standby is enough — it is advertised in the JWKS, so
# tokens verify without rotating, and Supabase Auth keeps signing user sessions
# with its own key). Missing or wrong ⇒ the boot preflight refuses to start
# rather than serve an app whose every tenant query would fail; that is what
# 503'd prod on v0.1.113, when the lane could only sign HS256.
#
# Identical topology to docker-compose.yaml, but pulls images built by the
# `build-images` GitHub Actions workflow from GHCR instead of building on the
# server. Point Coolify's compose file at this one; keep docker-compose.yaml
# for local/manual builds. The server's Docker daemon must be logged in to
# ghcr.io with a token that has read:packages (the PRO images are private).
#
# Image names are written out in full, never `${VAR:-default}` — Coolify's
# compose parser does not honor the fallback, and an unset variable collapses
# the reference to a bare name that cannot be pulled, after the old containers
# are already gone. The public mirror carries this same file with the `-pro`
# dropped, rewritten by scripts/publish-open-snapshot.sh, so an OSS install
# pulls the public packages without editing anything.
#
# The optional studio profile service still builds locally on the server (it is
# rarely enabled and small compared to edge/ai). Docs is prebuilt like the rest:
# it is a full monorepo install plus a Next build, far too heavy for the VPS.
#
# Profile services need COMPOSE_PROFILES set in the deployment's environment —
# Coolify has no --profile flag. Without it the service is silently skipped, and
# ENGENTY_GATEWAY_DOCS_ENABLED=true then makes every /docs URL a 502.

name: engenty

services:
  # One-shot migration runner: applies pending Supabase migrations, then exits.
  # The app services wait for it (service_completed_successfully) so no container
  # ever serves against a stale schema. No-op (exits 0) when SUPABASE_DB_URL is
  # unset — set it to enable automatic migrations (a direct Postgres URL; the
  # service-role key can't run DDL). See deploy/scripts/run-migrations.sh.
  engenty-migrate:
    image: ghcr.io/engenty/engenty-migrate:latest
    pull_policy: always
    restart: "no"
    environment:
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
    networks:
      - engenty

  engenty-edge:
    image: ghcr.io/engenty/engenty-edge:latest
    # Always pull :latest on deploy — without this, `docker compose up` reuses
    # the stale image already cached on the VPS and a new release never goes live.
    pull_policy: always
    restart: unless-stopped
    # Pin which network's IP Traefik targets — see docker-compose.yaml.
    labels:
      - traefik.docker.network=coolify
    # No host port publish ON PURPOSE. Traefik routes to this container over the
    # `coolify` network by label and infers 8787 from the image's EXPOSE, so the
    # publish bought nothing — while a bound host port makes it impossible for a
    # second edge container to exist, which is what forces every deploy to be
    # stop-old-then-start-new (i.e. a full outage). Use `docker exec` or a
    # temporary `-p` for host-level debugging instead of re-adding this.
    #
    # Faster than the image's 30s/60s defaults: Docker only marks a container
    # healthy on the first passing check, so a 30s interval kept a
    # ready-in-seconds container "starting" for half a minute, and Traefik will
    # not route to it until then. This is pure added downtime.
    #
    # The timeout must clear NODE'S STARTUP, not the app's response time: there
    # is no curl/wget in the image, and `node -e` costs ~3.8s to boot here. A 3s
    # timeout made every probe fail on a perfectly healthy container — the app
    # answered 200 instantly while Docker reported `unhealthy` and Traefik
    # served 503.
    healthcheck:
      interval: 10s
      retries: 3
      # Probe every 2s during the start window (Docker 25+): the server is up
      # in ~5s, but without this the FIRST probe fires only after `interval`
      # (10s) — and one missed probe meant ~25-30s of running-but-not-routed,
      # since Traefik waits for the first passing check.
      start_interval: 2s
      start_period: 15s
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8787/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      timeout: 8s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 8787
      ENGENTY_PROD_GATEWAY: "1"
      ENGENTY_GATEWAY_UI_ROOT: /app/apps/ui/dist
      ENGENTY_GATEWAY_MANAGE_ENABLED: ${ENGENTY_GATEWAY_MANAGE_ENABLED:-false}
      ENGENTY_GATEWAY_DOCS_ENABLED: ${ENGENTY_GATEWAY_DOCS_ENABLED:-false}
      ENGENTY_GATEWAY_STUDIO_ENABLED: ${ENGENTY_GATEWAY_STUDIO_ENABLED:-false}
      ENGENTY_GATEWAY_STUDIO_BASIC_AUTH: ${ENGENTY_GATEWAY_STUDIO_BASIC_AUTH:-}
      ENGENTY_GATEWAY_AI_URL: http://engenty-ai:8790
      ENGENTY_GATEWAY_DOCS_URL: http://engenty-docs:3000
      ENGENTY_GATEWAY_STUDIO_URL: http://engenty-studio:43111
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      ENGENTY_SECURITY_JWT_SECRET: ${ENGENTY_SECURITY_JWT_SECRET}
      # Server-lane signing key — see the header note. Unset on stacks that
      # still verify the symmetric secret (local, self-hosted).
      ENGENTY_SERVER_LANE_PRIVATE_KEY: ${ENGENTY_SERVER_LANE_PRIVATE_KEY:-}
      ENGENTY_SERVER_LANE_KEY_ID: ${ENGENTY_SERVER_LANE_KEY_ID:-}
      GOTENBERG_URL: http://gotenberg:3000
      CORS_ORIGIN: ${PUBLIC_APP_URL}
      ENGENTY_UI_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_API_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_AI_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_DOCS_BASE_URL: ${PUBLIC_APP_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # engenty Apps — the modules/engenty-apps plugin runs HERE, in core, not
      # only in apps/ai: it is what builds and calls deployed apps. Without
      # these two it logs "ENGENTY_APP_HOST_URL unset" at boot and every app
      # build fails, while app-host itself sits there perfectly healthy.
      ENGENTY_APP_HOST_URL: http://engenty-app-host:8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
      # The spaces tree, shared with app-host: a space's apps/ is bound into
      # that space's computer at /sandbox/apps.
      ENGENTY_SPACES_DIR: /opt/engenty/spaces
    depends_on:
      engenty-migrate:
        condition: service_completed_successfully
      # service_STARTED, not service_healthy: core only proxies to ai at request
      # time (ENGENTY_GATEWAY_AI_URL), so waiting for ai to pass a health check
      # put ai's entire boot inside the window where the site is down — for a
      # dependency core does not need in order to serve. /ai/* briefly 502s
      # while ai finishes; everything else is up.
      engenty-ai:
        condition: service_started
      gotenberg:
        condition: service_started
    networks:
      - engenty

  engenty-ai:
    image: ghcr.io/engenty/engenty-ai:latest
    pull_policy: always
    restart: unless-stopped
    # One Node process holds every tenant's runs, workspaces and sandbox
    # providers, so this is the real ceiling long before the sandbox containers
    # are. Raise both numbers together: a mem_limit without a matching heap
    # bound turns a slow-GC problem into an OOM-kill, because Node grows past
    # the cgroup ceiling rather than collecting. Heap ≈ 75% of the limit.
    # Literal, never `${VAR:-default}`: Coolify's compose parser drops the
    # fallback in non-env fields, and a silently-unset limit is the failure this
    # line exists to prevent.
    mem_limit: 4g
    cpus: 2.0
    # Same reasoning as core's: detect readiness in seconds, not half-minutes.
    healthcheck:
      interval: 10s
      retries: 3
      # Probe every 2s during the start window (Docker 25+): the server is up
      # in ~5s, but without this the FIRST probe fires only after `interval`
      # (10s) — and one missed probe meant ~25-30s of running-but-not-routed,
      # since Traefik waits for the first passing check.
      start_interval: 2s
      start_period: 15s
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8790/ai/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      timeout: 8s
    depends_on:
      engenty-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${ENGENTY_AI_MAX_OLD_SPACE_MB:-3072}
      HOST: 0.0.0.0
      PORT: 8790
      ENGENTY_CORE_BASE_URL: http://engenty-edge:8787
      ENGENTY_CORS_ORIGINS: ${ENGENTY_CORS_ORIGINS}
      ENGENTY_WORKSPACE_FS: remote
      ENGENTY_WORKSPACE_FS_PROVIDER: supabase
      ENGENTY_SANDBOX_PROVIDER: docker
      # Hardcoded (not ${VAR:-default}) — Coolify's compose parser doesn't honor
      # the :-default fallback, so an unset var collapsed this to the bare name
      # `engenty-sandbox` and the deploy failed pulling it from Docker Hub.
      ENGENTY_SANDBOX_DOCKER_IMAGE: ghcr.io/engenty/engenty-sandbox:latest
      # Where an `egress` sandbox is allowed to go — the proxy above. Both are
      # required together: the network alone would give the sandbox the open
      # internet, and the proxy alone would be unreachable.
      ENGENTY_SANDBOX_EGRESS_NETWORK: engenty-egress
      ENGENTY_SANDBOX_EGRESS_PROXY_URL: http://engenty-egress-proxy:8888
      # User browsers: own sealed network, own (open, logged) proxy, and the
      # view network apps/ai drives them over.
      ENGENTY_BROWSER_EGRESS_NETWORK: engenty-browser-egress
      ENGENTY_BROWSER_EGRESS_PROXY_URL: http://engenty-browser-proxy:8888
      ENGENTY_BROWSER_VIEW_NETWORK: engenty-browser-view
      # Named for the same reason as the sandbox image: apps/ai hands this
      # string to the host daemon, which resolves it against Docker Hub unless
      # it is fully qualified.
      ENGENTY_BROWSER_DOCKER_IMAGE: ghcr.io/engenty/engenty-browser:latest
      # MUST equal the host bind path below — see docker-compose.yaml.
      ENGENTY_LOCAL_WORKSPACE_ROOT: /opt/engenty/sandboxes
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      # apps/ai mints its own server-lane tokens (WP6) — same key as core.
      ENGENTY_SECURITY_JWT_SECRET: ${ENGENTY_SECURITY_JWT_SECRET}
      ENGENTY_SERVER_LANE_PRIVATE_KEY: ${ENGENTY_SERVER_LANE_PRIVATE_KEY:-}
      ENGENTY_SERVER_LANE_KEY_ID: ${ENGENTY_SERVER_LANE_KEY_ID:-}
      # Direct Postgres connection for the Mastra store (inbox notifications,
      # suspend/resume) and the notification pg pools (web push, email).
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      # Web push (VAPID). Unset ⇒ push channel off (config reports null).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # AI service identity — the durable credential apps/ai exchanges at core
      # for 15-min tokens (scheduler, task dispatcher, remote channels).
      # `engenty service-token create --name ai-service`.
      ENGENTY_AI_SERVICE_SECRET: ${ENGENTY_AI_SERVICE_SECRET:-}
      # engenty Apps — see docker-compose.yaml.
      ENGENTY_APP_HOST_URL: http://engenty-app-host:8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
      # The spaces tree, shared with app-host: a space's apps/ is bound into
      # that space's computer at /sandbox/apps.
      ENGENTY_SPACES_DIR: /opt/engenty/spaces
    volumes:
      # Literal path — Coolify rejects ${} in volume definitions; must match
      # ENGENTY_LOCAL_WORKSPACE_ROOT above (see docker-compose.yaml).
      - /opt/engenty/sandboxes:/opt/engenty/sandboxes
      # The spaces tree, same rule: literal path, mirrored 1:1.
      - /opt/engenty/spaces:/opt/engenty/spaces
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - engenty
      - engenty-browser-view

  # Runtime for tenant-authored engenty Apps — no published port, no gateway
  # target, no Traefik labels. See docker-compose.yaml for the full note.
  # Behind the `apps` profile: engenty Apps is the pro-only modules/engenty-apps
  # plugin, and the public build ships without it. Ungated, a public install
  # starts a service nothing can call, which then refuses to boot because
  # ENGENTY_APP_HOST_TOKEN is unset in production (apps/app-host/src/config.ts)
  # and crash-loops on `restart: unless-stopped`.
  #
  # PRO deployments must therefore ask for it: `--profile apps`, or
  # COMPOSE_PROFILES=apps on Coolify (which has no --profile flag). Without it
  # the service is skipped by `up` AND by `build`, and every app build fails
  # against a host that was never started. The blue-green production layout is
  # unaffected — docker-compose.backend.prebuilt.yaml runs app-host always.
  engenty-app-host:
    profiles:
      - apps
    image: ghcr.io/engenty/engenty-app-host:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ENGENTY_APP_HOST_PORT: 8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
      # The spaces tree: every App's source repository and /data directory.
      ENGENTY_SPACES_DIR: /opt/engenty/spaces
    # Bounds on tenant-authored code. agentos-apps exposes replica scaling but
    # no per-app memory knob, so the container is where the ceiling lives: each
    # app VM is ~22 MB plus the two native child processes. Raise deliberately.
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 4096
    volumes:
      - engenty-app-host-data:/data
      # The spaces tree (App repositories, App data); owned by uid 1000.
      - /opt/engenty/spaces:/opt/engenty/spaces
    networks:
      - engenty

  # Pull-only stand-in for the sandbox runtime image: `up` pulls it onto the
  # host daemon so engenty-ai can launch sibling containers from it. It is not
  # a network service (command exits 0 immediately).
  engenty-sandbox:
    image: ghcr.io/engenty/engenty-sandbox:latest
    pull_policy: always
    command: ["true"]
    restart: "no"
    networks:
      - engenty

  # Same stand-in trick for the per-user browser image: `up` pulls it onto the
  # host daemon so engenty-ai can launch one per person per space.
  engenty-browser:
    image: ghcr.io/engenty/engenty-browser:latest
    pull_policy: always
    command: ["true"]
    restart: "no"
    networks:
      - engenty

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      - engenty

  engenty-studio:
    profiles:
      - studio
    build:
      context: ..
      dockerfile: deploy/Dockerfile.studio
    restart: unless-stopped
    environment:
      MASTRA_STUDIO_BASE_PATH: /studio
      MASTRA_SKIP_PEERDEP_CHECK: "1"
      MASTRA_AI_HOST: engenty-ai
    depends_on:
      engenty-ai:
        condition: service_healthy
    networks:
      - engenty

  engenty-docs:
    profiles:
      - docs
    image: ghcr.io/engenty/engenty-docs:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_DOCS_SITE_URL: ${PUBLIC_APP_URL}
    networks:
      - engenty

  # Everything a sandbox is allowed to reach.
  #
  # A sandbox with `network: "egress"` joins `engenty-egress` INSTEAD of the
  # app network and points its proxy env here, so model-generated code can
  # install a package or call an API without also being able to reach
  # engenty-edge, the database, or anything else on the app network — the
  # things a sandbox has no business talking to and every reason to be kept
  # away from. Sandboxes with `network: "none"` (the default) join nothing.
  #
  # The allowlist is `deploy/egress-proxy/filter` — one host regex per line,
  # default-deny. It ships with the package registries an agent needs to install
  # what its script imports; add the APIs your agents call.
  engenty-egress-proxy:
    image: monokal/tinyproxy:latest
    pull_policy: always
    restart: unless-stopped
    # Run tinyproxy against OUR config rather than the image's generated one:
    # the image's arguments configure which CLIENTS may connect, and what this
    # proxy exists to control is which UPSTREAMS they may reach.
    entrypoint: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    # Small by construction: it forwards bytes and holds no state.
    mem_limit: 256m
    cpus: 0.5
    volumes:
      # Literal paths, no `${VAR}` — Coolify's compose parser drops the
      # fallback in volume definitions.
      - ./egress-proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./egress-proxy/filter:/etc/tinyproxy/filter:ro
    # No published port. Also on `engenty` because `engenty-egress` is
    # `internal` (no gateway) — the proxy needs the upstream route its
    # clients do not have.
    networks:
      - engenty-egress
      - engenty

  # The user browsers' proxy — open with a blocklist, every host logged. See
  # docker-compose.yaml for the full note.
  engenty-browser-proxy:
    image: monokal/tinyproxy:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./browser-proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./browser-proxy/filter:/etc/tinyproxy/filter:ro
    networks:
      - engenty-browser-egress
      - engenty

networks:
  engenty:
    driver: bridge
  # Sandboxes only. Deliberately separate from `engenty`: a container on this
  # network can reach the egress proxy and nothing else of ours. `internal`
  # makes the allowlist enforceable — no NAT gateway to bypass the proxy with.
  engenty-egress:
    driver: bridge
    internal: true
    # Named explicitly: apps/ai hands this string to the Docker daemon as the
    # network a sandbox joins, and a compose-prefixed name would not resolve.
    name: engenty-egress
  # User browsers and their proxy.
  engenty-browser-egress:
    driver: bridge
    internal: true
    name: engenty-browser-egress
  # Browsers ⇄ engenty-ai (CDP :9222). Attached post-start by apps/ai.
  engenty-browser-view:
    driver: bridge
    internal: true
    name: engenty-browser-view

volumes:
  # Durable RivetKit engine store for apps/app-host (deployed app releases).
  engenty-app-host-data:
