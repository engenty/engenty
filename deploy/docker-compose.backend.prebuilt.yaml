# Stable backend for blue/green edge deployments.
#
# Deploy this as a third Coolify application. It is deliberately not part of
# the edge cutover: both edge colors use the fixed aliases on engenty-runtime.
services:
  engenty-core-worker:
    image: ghcr.io/engenty/engenty-edge:${ENGENTY_BACKEND_RELEASE_TAG}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 15s
    healthcheck:
      interval: 10s
      retries: 3
      start_interval: 2s
      start_period: 20s
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8788/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      timeout: 8s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ENGENTY_CORE_PORT: 8788
      ENGENTY_PROD_GATEWAY: "0"
      ENGENTY_CORE_BACKGROUND_SERVICES_ENABLED: "true"
      ENGENTY_CORE_SHUTDOWN_TIMEOUT_MS: "8000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      ENGENTY_SECURITY_JWT_SECRET: ${ENGENTY_SECURITY_JWT_SECRET}
      ENGENTY_SERVER_LANE_PRIVATE_KEY: ${ENGENTY_SERVER_LANE_PRIVATE_KEY:-}
      ENGENTY_SERVER_LANE_KEY_ID: ${ENGENTY_SERVER_LANE_KEY_ID:-}
      GOTENBERG_URL: http://gotenberg:3000
      CORS_ORIGIN: ${PUBLIC_APP_URL}
      ENGENTY_UI_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_API_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_AI_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_DOCS_BASE_URL: ${PUBLIC_APP_URL}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENGENTY_APP_HOST_URL: http://engenty-app-host:8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
      # The one host root, shared with app-host: each Space's folder (its
      # computer's $HOME, /sandbox and caches, its browser profile and
      # downloads, its Apps) and the staging of object storage. Same path
      # inside and outside the container — apps/ai hands it to the Docker
      # daemon as a bind source for sibling containers.
      ENGENTY_SPACES_DIR: /opt/engenty/spaces
    networks:
      - runtime

  engenty-ai:
    image: ghcr.io/engenty/engenty-ai:${ENGENTY_BACKEND_RELEASE_TAG}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 15s
    # One Node process holds every tenant's runs, workspaces and sandbox
    # providers, so this is the real ceiling long before the sandbox containers
    # are. Raise both numbers together: a mem_limit without a matching heap
    # bound turns a slow-GC problem into an OOM-kill, because Node grows past
    # the cgroup ceiling rather than collecting. Heap ≈ 75% of the limit.
    # Literal, never `${VAR:-default}`: Coolify's compose parser drops the
    # fallback in non-env fields, and a silently-unset limit is the failure this
    # line exists to prevent.
    mem_limit: 4g
    cpus: 2.0
    healthcheck:
      interval: 10s
      retries: 3
      start_interval: 2s
      start_period: 20s
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8790/ai/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      timeout: 8s
    environment:
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=${ENGENTY_AI_MAX_OLD_SPACE_MB:-3072}
      HOST: 0.0.0.0
      PORT: 8790
      ENGENTY_CORE_BASE_URL: ${PUBLIC_APP_URL}
      ENGENTY_CORS_ORIGINS: ${ENGENTY_CORS_ORIGINS}
      ENGENTY_WORKSPACE_FS: remote
      ENGENTY_WORKSPACE_FS_PROVIDER: supabase
      ENGENTY_SANDBOX_PROVIDER: docker
      ENGENTY_SANDBOX_DOCKER_IMAGE: ghcr.io/engenty/engenty-sandbox:${ENGENTY_BACKEND_RELEASE_TAG}
      # Where an `egress` sandbox is allowed to go — the proxy below. Both are
      # required together: the network alone would give the sandbox the open
      # internet, and the proxy alone would be unreachable.
      ENGENTY_SANDBOX_EGRESS_NETWORK: engenty-egress
      ENGENTY_SANDBOX_EGRESS_PROXY_URL: http://engenty-egress-proxy:8888
      # User browsers: own sealed network, own (open, logged) proxy, and the
      # view network apps/ai drives them over.
      ENGENTY_BROWSER_EGRESS_NETWORK: engenty-browser-egress
      ENGENTY_BROWSER_EGRESS_PROXY_URL: http://engenty-browser-proxy:8888
      # Fully qualified: apps/ai hands this to the host daemon, which would
      # otherwise look for a bare name on Docker Hub.
      ENGENTY_BROWSER_DOCKER_IMAGE: ghcr.io/engenty/engenty-browser:${ENGENTY_BACKEND_RELEASE_TAG}
      ENGENTY_BROWSER_VIEW_NETWORK: engenty-browser-view
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      ENGENTY_SECURITY_JWT_SECRET: ${ENGENTY_SECURITY_JWT_SECRET}
      ENGENTY_SERVER_LANE_PRIVATE_KEY: ${ENGENTY_SERVER_LANE_PRIVATE_KEY:-}
      ENGENTY_SERVER_LANE_KEY_ID: ${ENGENTY_SERVER_LANE_KEY_ID:-}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENGENTY_AI_SERVICE_SECRET: ${ENGENTY_AI_SERVICE_SECRET:-}
      ENGENTY_APP_HOST_URL: http://engenty-app-host:8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
      # The one host root, shared with app-host: each Space's folder (its
      # computer's $HOME, /sandbox and caches, its browser profile and
      # downloads, its Apps) and the staging of object storage. Same path
      # inside and outside the container — apps/ai hands it to the Docker
      # daemon as a bind source for sibling containers.
      ENGENTY_SPACES_DIR: /opt/engenty/spaces
    volumes:
      # The one host root, mirrored 1:1 — see docker-compose.yaml.
      - /opt/engenty/spaces:/opt/engenty/spaces
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      runtime:
        aliases:
          - engenty-ai
      browser-view: {}

  engenty-app-host:
    image: ghcr.io/engenty/engenty-app-host:${ENGENTY_BACKEND_RELEASE_TAG}
    pull_policy: always
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      interval: 10s
      retries: 3
      start_interval: 2s
      start_period: 20s
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:8795/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      timeout: 8s
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      ENGENTY_APP_HOST_PORT: 8795
      ENGENTY_APP_HOST_TOKEN: ${ENGENTY_APP_HOST_TOKEN:-}
      # The spaces tree: every App's source repository and /data directory.
      ENGENTY_SPACES_DIR: /opt/engenty/spaces
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 4096
    volumes:
      - /opt/engenty/app-host-data:/data
      # The spaces tree (App repositories, App data); owned by uid 1000.
      - /opt/engenty/spaces:/opt/engenty/spaces
    networks:
      runtime:
        aliases:
          - engenty-app-host

  engenty-sandbox:
    image: ghcr.io/engenty/engenty-sandbox:${ENGENTY_BACKEND_RELEASE_TAG}
    pull_policy: always
    command: ["true"]
    restart: "no"
    networks:
      - runtime

  # Same stand-in trick for the per-user browser image.
  engenty-browser:
    image: ghcr.io/engenty/engenty-browser:${ENGENTY_BACKEND_RELEASE_TAG}
    pull_policy: always
    command: ["true"]
    restart: "no"
    networks:
      - runtime

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    networks:
      runtime:
        aliases:
          - gotenberg

  engenty-docs:
    profiles:
      - docs
    image: ghcr.io/engenty/engenty-docs:${ENGENTY_BACKEND_RELEASE_TAG}
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_PUBLIC_DOCS_SITE_URL: ${PUBLIC_APP_URL}
    networks:
      runtime:
        aliases:
          - engenty-docs

  engenty-studio:
    profiles:
      - studio
    build:
      context: ..
      dockerfile: deploy/Dockerfile.studio
    restart: unless-stopped
    environment:
      MASTRA_STUDIO_BASE_PATH: /studio
      MASTRA_SKIP_PEERDEP_CHECK: "1"
      MASTRA_AI_HOST: engenty-ai
    depends_on:
      engenty-ai:
        condition: service_healthy
    networks:
      runtime:
        aliases:
          - engenty-studio

  # Everything a sandbox is allowed to reach.
  #
  # A sandbox with `network: "egress"` joins `engenty-egress` INSTEAD of the
  # runtime network and points its proxy env here, so model-generated code can
  # install a package or call an API without also being able to reach core, the
  # database, or anything else this stack runs. Sandboxes with `network:
  # "none"` (the default) join nothing.
  #
  # The shared allowlist is `deploy/egress-proxy/filter` — one host regex per
  # line, default-deny, the package registries an agent needs to install what
  # its script imports. A Space adds its own hosts in its settings.
  engenty-egress-proxy:
    image: node:24-alpine
    pull_policy: always
    restart: unless-stopped
    # Our own proxy (egress-proxy/proxy.mjs, no dependencies): the shared
    # allowlist in `filter` for every sandbox, plus a Space computer's own
    # hosts when it names its Space in the proxy URL. apps/ai publishes
    # those lists under <spaces>/egress/.
    user: node
    command: ["node", "/opt/egress-proxy/proxy.mjs"]
    environment:
      EGRESS_FILTER: /opt/egress-proxy/filter
      EGRESS_SPACES_DIR: /etc/engenty-egress/spaces
    # Small by construction: it forwards bytes and holds no state.
    mem_limit: 256m
    cpus: 0.5
    volumes:
      # Literal paths, no `${VAR}` — Coolify's compose parser drops the
      # fallback in volume definitions.
      - ./egress-proxy:/opt/egress-proxy:ro
      - /opt/engenty/spaces/egress:/etc/engenty-egress/spaces:ro
    # No published port. Also on `runtime` because `engenty-egress` is
    # `internal` (no gateway) — the proxy needs the upstream route its
    # clients do not have.
    networks:
      - egress
      - runtime

  # The user browsers' proxy — open with a blocklist, every host logged. See
  # docker-compose.yaml for the full note.
  engenty-browser-proxy:
    image: monokal/tinyproxy:latest
    pull_policy: always
    restart: unless-stopped
    entrypoint: ["tinyproxy", "-d", "-c", "/etc/tinyproxy/tinyproxy.conf"]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - ./browser-proxy/tinyproxy.conf:/etc/tinyproxy/tinyproxy.conf:ro
      - ./browser-proxy/filter:/etc/tinyproxy/filter:ro
    networks:
      - browser-egress
      - runtime

networks:
  runtime:
    external: true
    name: engenty-runtime
  # Sandboxes only. Deliberately separate from `runtime`: a container on this
  # network can reach the egress proxy and nothing else of ours. `internal`
  # makes the allowlist enforceable — no NAT gateway to bypass the proxy with.
  egress:
    internal: true
    name: engenty-egress
  # User browsers and their proxy.
  browser-egress:
    internal: true
    name: engenty-browser-egress
  # Browsers ⇄ engenty-ai (CDP :9222). Attached post-start by apps/ai.
  browser-view:
    internal: true
    name: engenty-browser-view
