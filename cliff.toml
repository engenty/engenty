# git-cliff configuration — drives `pnpm release`.
# Compact changelog: `- ADDED **[scope]** description` when the commit has a scope;
# `- ADDED description` when it does not. Scopes come from Conventional Commits
# (`feat(tasks): …`, `fix(ci): …`). See docs/content/dev/releases-and-versioning.md.
# https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to Engenty. Generated from [Conventional Commits](https://www.conventionalcommits.org/)
by [git-cliff](https://git-cliff.org) via `pnpm release`. Pre-`1.0`: a **minor**
bump is a notable or breaking change, **patch** is fixes and small features.
"""
# One release block. `version` is set when rendering a tagged release,
# absent for the unreleased preview.
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}\
{% for commit in commits %}\
- {{ group | upper }}{% if commit.scope %} **[{{ commit.scope }}]**{% endif %} {{ commit.message | upper_first | trim }}\
{% if commit.breaking %} **[breaking]**{% endif %}
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
# Keep unconventional commits instead of dropping them silently. Every commit
# then flows through `commit_parsers` below: the truly-ignorable ones (merges,
# release/chore noise) are skipped on purpose, and anything meaningful that
# predates — or forgets — the Conventional Commits convention lands in "Other"
# rather than vanishing with a "N commit(s) skipped due to parse error(s)" warn.
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "newest"
# Map commit types → human-facing changelog groups (Keep-a-Changelog verbs).
# Parsers run top-to-bottom, first match wins; the trailing `.*` is the
# catch-all for non-conventional messages so nothing is dropped unintentionally.
commit_parsers = [
  # Intentionally dropped noise — silent, on purpose (not parse errors).
  { message = "^Merge ", skip = true },
  { message = "^(chore|ci|test|build|style)(\\(.*\\))?!?:", skip = true },
  # Conventional types → grouped changelog entries.
  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Changed" },
  { message = "^deploy", group = "Deploy" },
  { message = "^docs", group = "Docs" },
  # Everything else (pre-convention or malformed) — captured, not lost.
  { message = ".*", group = "Other" },
]

[bump]
# Pre-1.0: breaking changes bump minor (not major), features bump patch —
# matches the alpha semantics. release.mjs lets you override the level anyway.
features_always_bump_minor = false
breaking_always_bump_major = false
