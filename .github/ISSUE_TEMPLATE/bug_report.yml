---
name: Bug report
about: Report a problem with the open Engenty base
title: ""
labels: bug
assignees: ""
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing issues first.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug and what you expected instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. pnpm dev
        2. Open ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main @ abc1234
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant terminal output or attach screenshots.
    validations:
      required: false
