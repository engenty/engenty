# Real-database integration lane: local Supabase + migrations + the
# `*.integration.test.ts` suites + the RLS coverage guard (which is a no-op
# in the DB-less unit job but a real gate here).
#
# Runs on main pushes and nightly — not on every PR push — to keep Actions
# usage in check (see the 2026-07 runner-budget incident). Trigger manually
# via workflow_dispatch when validating a branch.
name: Integration

on:
  push:
    branches: [main]
  schedule:
    - cron: "20 3 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Read-only reuse of the unit pipeline's turbo cache (ci.yml saves it).
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      # `supabase start` here and the `supabase` calls inside `engenty db *`
      # both resolve the CLI from PATH (a Homebrew global on dev machines).
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable workspace plugins
        run: pnpm engenty plugins install --all

      - name: Setup generated local artifacts
        run: pnpm run setup

      - name: Start local Supabase
        run: supabase start -x studio,inbucket

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Export Supabase env
        run: |
          supabase status -o env \
            | sed -n 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p; s/^API_URL=/SUPABASE_URL=/p' \
            | tr -d '"' >> "$GITHUB_ENV"

      # Integration suites import workspace packages whose exports resolve to
      # dist — build just the dependency closures of the touched packages.
      - name: Build integration targets
        run: pnpm exec turbo run build --filter=@engenty/retrieval --filter=@engenty/tasks --concurrency=4

      - name: Integration tests
        run: pnpm test:integration

      - name: RLS coverage guard
        run: pnpm check:rls-coverage
