name: Build desktop app

# Builds the macOS desktop app (Tauri) on release tags and attaches the .dmg
# to the GitHub release for the tag. Unsigned for now — first launch needs
# right-click → Open (Gatekeeper). Runs alongside build-images.yml on v* tags.
#
# The UI bundle is built WITHOUT any VITE_* server values on purpose: the
# desktop shell selects its server at runtime (first-launch server picker →
# GET /api/desktop/bootstrap).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable workspace plugins
        run: pnpm engenty plugins install --all

      - name: Setup generated local artifacts
        run: pnpm run setup

      - name: Build UI (no baked server config)
        run: pnpm build

      - name: Build desktop app (.dmg)
        run: pnpm --filter @engenty/desktop bundle:dmg -- --target aarch64-apple-darwin

      - name: Attach .dmg to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DMG=$(ls apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg | head -1)
          VERSIONED="engenty-desktop-${GITHUB_REF_NAME}-macos-arm64.dmg"
          cp "$DMG" "$VERSIONED"
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" "$VERSIONED" --clobber

      - name: Upload .dmg as workflow artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: engenty-desktop-macos-arm64
          path: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
