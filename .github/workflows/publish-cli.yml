name: Publish engenty CLI

# Publishes `packages/cli` to npmjs as `engenty`, so `npx engenty create`,
# `npx engenty deploy` and `npx engenty doctor --remote` exist at the release's
# version. scripts/publish-cli.mjs stages the package and bakes the release
# facts (schemas, migrations, compose templates) into it.
#
# INSTALL THIS ON THE MIRROR BY HAND, under this exact filename.
# publish-open-snapshot.sh deliberately keeps the mirror's own .github/workflows
# and drops pro's, so this file is not synced — engenty-pro holds it as the
# reviewable source, and engenty/engenty needs its own copy committed directly.
# Re-copy it when it changes here. The filename matters twice over: npm's
# trusted publisher for the package pins `engenty/engenty` + `publish-cli.yml`,
# and a rename there silently breaks publishing.
#
# Runs ONLY on engenty/engenty. The package is built from the open tree so its
# provenance points at the repository users can actually read, and pro's tree
# still holds the closed modules. Pro's own tag runs check-cli-package.yml,
# which stages the same package and only dry-runs it.
#
# Auth is npm Trusted Publishing (GitHub OIDC): npm >= 11.5.1 swaps the job's
# id-token for a short-lived publish token, so there is no NPM_TOKEN secret and
# nothing to rotate. The publisher must allow `npm publish` (not just
# `npm stage publish`) and name no environment.
#
# workflow_dispatch with `version` re-publishes that version from main (recovery
# after a workflow fix). Leaving `version` empty dry-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.12). Empty = dry-run only."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    if: github.repository == 'engenty/engenty'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI and its workspace dependencies
        run: pnpm exec turbo run build --filter=@engenty/cli...

      - name: Supabase CLI pin is consistent
        run: pnpm check:supabase-pin

      - name: npm supports Trusted Publishing
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $v is too old for Trusted Publishing (needs >= 11.5.1)."
            exit 1
          fi
          echo "npm $v"

      - name: Publish `engenty` to npm
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/publish-cli.mjs --version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            node scripts/publish-cli.mjs --version="${{ inputs.version }}"
          else
            echo "Dry-run (no version given on dispatch)."
            node scripts/publish-cli.mjs --dry-run
          fi
