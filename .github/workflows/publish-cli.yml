name: Publish engenty CLI

# On a release tag (pushed here by engenty-pro's publish-open.yml together with
# the open snapshot), publish packages/cli to npmjs as `engenty`, so
# `npx engenty create`, `npx engenty deploy` and `npx engenty doctor --remote`
# exist at the release's version. scripts/publish-cli.mjs stages the package
# and bakes the release facts (schemas, migrations, compose templates) into it.
#
# This is the one place the npm package is published from: the tarball is built
# from this open tree, and npm provenance links it to this repo. Auth is npm
# Trusted Publishing (GitHub OIDC) — the `engenty` package on npmjs lists this
# repo + this workflow file as its trusted publisher, and npm >= 11.5.1 swaps
# the job's id-token for a short-lived publish token. No secret to rotate.
#
# workflow_dispatch with `version` re-publishes that version from main
# (recovery after a workflow fix). Leaving `version` empty dry-runs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (e.g. 0.2.12). Empty = dry-run only."
        required: false
        type: string

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the CLI and its workspace dependencies
        run: pnpm exec turbo run build --filter=@engenty/cli...

      - name: Supabase CLI pin is consistent
        run: pnpm check:supabase-pin

      - name: npm supports Trusted Publishing
        run: |
          v="$(npm --version)"
          if [ "$(printf '%s\n11.5.1\n' "$v" | sort -V | head -1)" != "11.5.1" ]; then
            echo "::error::npm $v is too old for Trusted Publishing (needs >= 11.5.1)."
            exit 1
          fi
          echo "npm $v"

      - name: Publish `engenty` to npm
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/publish-cli.mjs --version="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            node scripts/publish-cli.mjs --version="${{ inputs.version }}"
          else
            echo "Dry-run (no version given on dispatch)."
            node scripts/publish-cli.mjs --dry-run
          fi
