name: release-please

# Maintains a rolling "Release PR" from Conventional Commit messages on main.
# Merging that PR bumps the version in package.json + CHANGELOG.md, tags v0.x.y,
# and cuts a GitHub Release. Deploys are NOT gated on this — releases are
# annotations over the per-push deploy flow.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
