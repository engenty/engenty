# Browser smoke lane: full stack (local Supabase + core + ai + ui dev
# servers) driven through the rendered UI with Playwright (e2e/smoke/*).
#
# Nightly + manual only while the lane earns trust; promote to a release
# gate once it has a clean streak. Runs no LLM spec (copilot is gated on
# ENGENTY_SMOKE_LLM=1).
name: Smoke

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Dev-only login bypass consumed by /auth/agent-login (non-prod).
      ENGENTY_DEV_PASS: engenty-smoke-ci
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable workspace plugins
        run: pnpm engenty plugins install --all

      - name: Setup generated local artifacts
        run: pnpm run setup

      - name: Start local Supabase
        run: pnpm supabase:start -- -x studio,inbucket

      - name: Apply migrations
        run: pnpm db:migrate

      - name: Write local env
        run: |
          {
            pnpm exec supabase status -o env \
              | sed -n 's/^SERVICE_ROLE_KEY=/SUPABASE_SERVICE_ROLE_KEY=/p; s/^ANON_KEY=/SUPABASE_ANON_KEY=/p; s/^API_URL=/SUPABASE_URL=/p' \
              | tr -d '"'
            echo "ENGENTY_DEV_PASS=$ENGENTY_DEV_PASS"
          } >> .env.local

      - name: Build
        run: pnpm exec turbo run build --concurrency=4

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # playwright.config.ts webServer boots `pnpm run dev` and waits for
      # the UI origin before the specs run.
      - name: Smoke tests
        run: pnpm test:smoke

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/.report
            e2e/.results
          retention-days: 7
