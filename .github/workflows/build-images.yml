name: Build deploy images

# Builds the production images on GitHub runners and pushes them to GHCR so the
# VPS never has to build (see deploy/docker-compose.prebuilt.yaml). Optionally
# triggers a Coolify redeploy when the COOLIFY_DEPLOY_ENABLED repo variable is
# set to 'true'.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: edge
            dockerfile: deploy/Dockerfile.edge
          - service: ai
            dockerfile: deploy/Dockerfile.ai
          - service: sandbox
            dockerfile: deploy/Dockerfile.sandbox
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ghcr.io/engenty/engenty-${{ matrix.service }}:latest
            ghcr.io/engenty/engenty-${{ matrix.service }}:${{ github.sha }}
          # VITE_* values are baked into the UI bundle at build time; the other
          # Dockerfiles ignore these args. Set as repo variables (they are
          # client-exposed values, not secrets).
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_ENGENTY_AI_BASE_URL=${{ vars.PUBLIC_APP_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: build
    if: vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Coolify redeploy
        run: |
          curl -sfS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            "${{ vars.COOLIFY_URL }}/api/v1/deploy?uuid=${{ vars.COOLIFY_APP_UUID }}"
