name: Build deploy images

# Builds the production images on GitHub runners and pushes them to GHCR so the
# VPS never has to build (see deploy/docker-compose.prebuilt.yaml). Optionally
# triggers a Coolify redeploy when the COOLIFY_DEPLOY_ENABLED repo variable is
# set to 'true'.
#
# Path-filtered: each image is rebuilt only when its own inputs change, so a
# docs-only, README, or single-app change no longer rebuilds all three images.
#   - edge    → root manifests, scripts, packages, modules, apps/core, apps/ui
#   - ai      → root manifests, scripts, packages, modules, apps/ai
#   - sandbox → deploy/Dockerfile.sandbox only (image copies no repo source)
# A workflow change rebuilds everything; a deploy/** config change (e.g. the
# compose) still triggers a redeploy even when no image is rebuilt.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      services: ${{ steps.set.outputs.services }}
      deploy: ${{ steps.set.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            edge:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'scripts/**'
              - 'packages/**'
              - 'modules/**'
              - 'apps/core/**'
              - 'apps/ui/**'
              - 'deploy/Dockerfile.edge'
              - '.github/workflows/build-images.yml'
            ai:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'turbo.json'
              - 'tsconfig.base.json'
              - 'scripts/**'
              - 'packages/**'
              - 'modules/**'
              - 'apps/ai/**'
              - 'deploy/Dockerfile.ai'
              - '.github/workflows/build-images.yml'
            sandbox:
              - 'deploy/Dockerfile.sandbox'
              - '.github/workflows/build-images.yml'
            deploy_config:
              - 'deploy/**'

      - id: set
        # Emit the JSON matrix of services to build and whether to redeploy.
        # workflow_dispatch has no diff base, so build everything on manual runs.
        env:
          MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          EDGE: ${{ steps.filter.outputs.edge }}
          AI: ${{ steps.filter.outputs.ai }}
          SANDBOX: ${{ steps.filter.outputs.sandbox }}
          DEPLOY_CONFIG: ${{ steps.filter.outputs.deploy_config }}
        run: |
          if [ "$MANUAL" = "true" ]; then
            echo 'services=["edge","ai","sandbox"]' >> "$GITHUB_OUTPUT"
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          svc=()
          [ "$EDGE" = "true" ] && svc+=('"edge"')
          [ "$AI" = "true" ] && svc+=('"ai"')
          [ "$SANDBOX" = "true" ] && svc+=('"sandbox"')
          IFS=,
          echo "services=[${svc[*]}]" >> "$GITHUB_OUTPUT"
          unset IFS
          if [ "${#svc[@]}" -gt 0 ] || [ "$DEPLOY_CONFIG" = "true" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/engenty/engenty-${{ matrix.service }}:latest
            ghcr.io/engenty/engenty-${{ matrix.service }}:${{ github.sha }}
          # VITE_* values are baked into the UI bundle at build time; the other
          # Dockerfiles ignore these args. Set as repo variables (they are
          # client-exposed values, not secrets).
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_ENGENTY_AI_BASE_URL=${{ vars.PUBLIC_APP_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    needs: [changes, build]
    # Run when an image was (re)built or the deploy config changed, and never
    # after a failed/cancelled build. `always()` lets it run even when `build`
    # was skipped (config-only change → no images to build).
    if: >-
      always()
      && vars.COOLIFY_DEPLOY_ENABLED == 'true'
      && needs.changes.outputs.deploy == 'true'
      && needs.build.result != 'failure'
      && needs.build.result != 'cancelled'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Trigger the deploy over SSH instead of Coolify's HTTP API: the API is
      # IP-allowlisted to the operator's addresses and GitHub runner IPs are
      # dynamic. SSH (port 22) is not allowlisted; the key is pinned to a forced
      # command on the VPS (see deploy/scripts/coolify-deploy.sh) so it can ONLY
      # queue this app's deployment — no shell, no other action. The forced
      # command ignores whatever command we send, so `true` is enough.
      - name: Trigger Coolify deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
        run: |
          test -n "$DEPLOY_SSH_KEY" || { echo "VPS_DEPLOY_SSH_KEY secret is not set"; exit 1; }
          test -n "$DEPLOY_HOST"    || { echo "VPS_DEPLOY_HOST variable is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/ci_deploy_key <<< "$DEPLOY_SSH_KEY"
          ssh -i ~/.ssh/ci_deploy_key \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "root@${DEPLOY_HOST}" true
