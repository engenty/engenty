name: Build deploy images

# Builds the production images on GitHub runners and pushes them to GHCR so the
# VPS never has to build (see deploy/docker-compose.prebuilt.yaml), then triggers
# a Coolify redeploy.
#
# Release-gated: runs ONLY on release tags (v*). Pushes to main do NOT build or
# deploy — cut a release to ship:
#   pnpm release                       # commit + annotated tag vX.Y.Z (local)
#   git push origin main --follow-tags # pushes the commit AND the tag -> this workflow
# `ci.yml` still lints/typechecks/tests every push to main. workflow_dispatch is
# kept for manual rebuilds/redeploys (e.g. a compose-only change).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # edge is the heaviest image (core + UI + every package/module + the
        # Manage portal); a cold DTS build OOM'd it at 4, so give it 2. The
        # others stay at 4.
        include:
          - service: edge
            concurrency: 2
          - service: ai
            concurrency: 4
          - service: sandbox
            concurrency: 4
          - service: app-host
            concurrency: 4
          - service: migrate
            concurrency: 4
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        # Fail fast on a stalled build/push/cache-export instead of hanging to
        # the 60-min job cap. A cold build (~20-25min) fits comfortably; a hang
        # is caught ~15min sooner so the run can be reran promptly.
        timeout-minutes: 45
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.service }}
          push: true
          # :latest is what the prebuilt compose pulls; the tag ref (vX.Y.Z on a
          # release) and commit SHA are immutable pins for traceability/rollback.
          tags: |
            ghcr.io/engenty/engenty-${{ matrix.service }}:latest
            ghcr.io/engenty/engenty-${{ matrix.service }}:${{ github.ref_name }}
            ghcr.io/engenty/engenty-${{ matrix.service }}:${{ github.sha }}
          # VITE_* values are baked into the UI bundle at build time; the other
          # Dockerfiles ignore these args. Set as repo variables (they are
          # client-exposed values, not secrets). TURBO_BUILD_CONCURRENCY caps
          # parallel tsup/tsc --dts workers (each 1-2 GB): the Dockerfile default
          # of 10 OOMs the runner when building @engenty/ai + all modules, so
          # pin it to CI's proven value. (Remote turbo cache wiring lands with
          # the cache server — TURBO_API/TURBO_TOKEN.)
          build-args: |
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ vars.VITE_SUPABASE_ANON_KEY }}
            VITE_ENGENTY_AI_BASE_URL=${{ vars.PUBLIC_APP_URL }}
            TURBO_BUILD_CONCURRENCY=${{ matrix.concurrency }}
          # Registry-backed layer cache (GHCR): no 10-GB GHA cache cap and no
          # export stalls — the GHA cache backend was the source of the ai/edge
          # build-push hangs. mode=max keeps full multi-stage layer reuse.
          cache-from: type=registry,ref=ghcr.io/engenty/engenty-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=ghcr.io/engenty/engenty-${{ matrix.service }}:buildcache,mode=max

  deploy:
    needs: build
    if: vars.COOLIFY_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Two routes to the same action (queue a deployment of this app), tried in
      # order. Neither is a fallback for a *failing* deploy — they are fallbacks
      # for an unreachable control plane, which is what actually breaks here.
      #
      # 1. HTTPS to Coolify's API. Preferred when COOLIFY_API_TOKEN is set:
      #    port 443 is the one port that must stay open for the panel to work at
      #    all, so it cannot be closed to runners without also locking the
      #    operator out of the UI.
      # 2. SSH, with the key pinned to a forced command on the VPS (see
      #    deploy/scripts/coolify-deploy.sh) so a leaked key can ONLY queue this
      #    app's deployment — no shell, no other action. The forced command
      #    ignores whatever we send, so `true` is enough.
      #
      # This job used to be SSH-only, on the premise that port 22 was not
      # IP-allowlisted. That premise is false: since v0.1.79 the runners time out
      # on 22 while the same host answers instantly from the operator's address.
      - name: Trigger Coolify deploy
        env:
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          COOLIFY_URL: ${{ vars.COOLIFY_URL }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          DEPLOY_SSH_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ vars.VPS_DEPLOY_HOST }}
        run: |
          set -uo pipefail

          if [ -n "${COOLIFY_API_TOKEN:-}" ]; then
            test -n "$COOLIFY_URL"      || { echo "COOLIFY_URL variable is not set"; exit 1; }
            test -n "$COOLIFY_APP_UUID" || { echo "COOLIFY_APP_UUID variable is not set"; exit 1; }
            echo "Queueing deploy via Coolify API…"
            code=$(curl -sS --max-time 60 -o /tmp/deploy.json -w '%{http_code}' \
              -H "Authorization: Bearer ${COOLIFY_API_TOKEN}" \
              "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=false") || code=000
            # Print the body either way: on success it carries the deployment
            # uuid, and on failure it is the only thing that distinguishes a bad
            # token (401) from an IP allowlist (403) from a wrong uuid (404).
            cat /tmp/deploy.json; echo
            if [ "$code" = "200" ]; then
              echo "Deploy queued (HTTP 200)."
              exit 0
            fi
            echo "Coolify API returned HTTP ${code} — falling back to SSH."
          fi

          test -n "$DEPLOY_SSH_KEY" || { echo "No COOLIFY_API_TOKEN and no VPS_DEPLOY_SSH_KEY — nothing to deploy with"; exit 1; }
          test -n "$DEPLOY_HOST"    || { echo "VPS_DEPLOY_HOST variable is not set"; exit 1; }
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/ci_deploy_key <<< "$DEPLOY_SSH_KEY"
          echo "Queueing deploy over SSH…"
          ssh -i ~/.ssh/ci_deploy_key \
            -o StrictHostKeyChecking=accept-new -o BatchMode=yes -o ConnectTimeout=20 \
            "root@${DEPLOY_HOST}" true
