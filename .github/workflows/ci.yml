name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the Lint step can diff against the PR base / prior push.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable workspace plugins
        run: pnpm engenty plugins install --all

      - name: Generate derived local artifacts
        run: pnpm engenty generate

      - name: Validate engenty.plugins
        run: pnpm plugins:check

      - name: Supabase config template check
        run: pnpm supabase:config:check

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      # Lint only the files this PR/push changes, not the whole repo. The repo
      # carries pre-existing lint debt; a repo-wide `pnpm check` would fail every
      # PR on unrelated files. This keeps the gate meaningful (blocks NEW issues)
      # while a separate cleanup works through the backlog. Same ultracite
      # ruleset — just scoped to the changed paths.
      - name: Lint (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css)$' || true)
          if [ -z "$files" ]; then
            echo "No lintable files changed — skipping."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$files"
          echo "$files" | xargs -d '\n' pnpm exec ultracite check

      - name: Env example sync
        run: pnpm env:example:check

      # No Supabase env on purpose. Pointing SUPABASE_URL at a port nothing
      # listens on does not give the unit tests a database — it makes
      # createAiDatabaseAdapter() hand back a live client, so code that treats
      # "no database configured" as its fast path instead issues a real request
      # and fails ~7s later. That is what broke
      # registry-routes "should delete agent in the resolved tenant scope":
      # the handler's workflow-reference lookup went to the network and the
      # route answered 500. engenty-pro runs these same 298 files with no
      # Supabase env and they pass.
      - name: Test
        run: pnpm test
