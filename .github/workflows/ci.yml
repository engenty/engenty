name: CI

# paths-ignore: root-level markdown (plans, AGENTS, README, CHANGELOG) and
# session config never affect build/test output. Deliberately narrow — docs/**
# markdown DOES feed the docs app build and stays CI-gated. Release pushes
# still run CI because they always touch package.json/changelog.json.
on:
  push:
    branches: [main]
    paths-ignore: ["*.md", ".claude/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["*.md", ".claude/**"]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded runs only on PRs. On main, the running build must FINISH:
  # with several sessions pushing every ~30min, cancel-in-progress meant no
  # cold build ever completed and the turbo cache never seeded. Queued main
  # runs collapse to the newest one automatically, so nothing piles up.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    # A cold turbo build alone takes ~20min (no remote cache in CI); 30min
    # killed every push on busy days once typecheck/tests queued behind it.
    timeout-minutes: 60
    env:
      # secrets context is not allowed in step-level `if` — computed here
      # (job env allows it) and consumed by the remote-cache step below.
      HAS_REMOTE_CACHE: ${{ vars.TURBO_API != '' && secrets.TURBO_TOKEN != '' }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the Lint step can diff against the PR base / prior push.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      # Optional remote turbo cache: activates only when the repo has the
      # TURBO_API repo variable + TURBO_TOKEN secret configured (self-hosted
      # turborepo-remote-cache, see docs/content/dev/ci-pipeline.md). Until
      # then turbo uses the local .turbo/cache persisted below.
      - name: Enable remote turbo cache (if configured)
        if: ${{ env.HAS_REMOTE_CACHE == 'true' }}
        run: |
          {
            echo "TURBO_API=${{ vars.TURBO_API }}"
            echo "TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}"
            echo "TURBO_TEAM=${{ vars.TURBO_TEAM || 'team_engenty' }}"
          } >> "$GITHUB_ENV"

      # Persist turbo's local task cache across runs: a cold build of the
      # workspace takes ~20min, a warm one minutes. Keyed by SHA with a
      # prefix fallback so every run restores the most recent cache. Saved
      # explicitly right after Build (not via the post hook) so the cache
      # survives even when a later step dies or the runner is reclaimed.
      - name: Restore turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable workspace plugins
        run: pnpm engenty plugins install --all

      - name: Setup generated local artifacts
        run: pnpm run setup

      - name: Validate engenty.plugins
        run: pnpm plugins:check

      # Guards the per-package test pipeline: every package with tests must
      # have a (properly scoped) test script, or `turbo run test` skips it.
      - name: Test wiring check
        run: pnpm check:test-wiring

      - name: Supabase config template check
        run: pnpm supabase:config:check

      # --concurrency=4 matches the runner's 4 vCPUs. Turbo's default of 10
      # parallel tasks lets the tail of ~8 heavy tsup --dts builds (1-2GB
      # each) run at once on a 16GB runner — memory thrash, build wedges
      # after ~55/63 tasks with zero output. Locally (more cores/RAM) this
      # never shows.
      - name: Build
        run: pnpm exec turbo run build --concurrency=4

      - name: Save turbo cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}

      - name: Typecheck
        run: pnpm typecheck

      # Lint only the files this PR/push changes, not the whole repo. The repo
      # carries pre-existing lint debt; a repo-wide `pnpm check` would fail every
      # PR on unrelated files. This keeps the gate meaningful (blocks NEW issues)
      # while a separate cleanup works through the backlog. Same ultracite
      # ruleset — just scoped to the changed paths.
      - name: Lint (changed files)
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || git rev-parse HEAD)"
          fi
          files=$(git diff --name-only --diff-filter=ACMR "$base" HEAD \
            | grep -E '\.(ts|tsx|js|jsx|mjs|cjs|json|jsonc|css)$' || true)
          if [ -z "$files" ]; then
            echo "No lintable files changed — skipping."
            exit 0
          fi
          echo "Linting changed files:"
          echo "$files"
          echo "$files" | xargs -d '\n' pnpm exec ultracite check

      - name: Env example sync
        run: pnpm env:example:check

      # Per-package via turbo so unchanged packages are cache hits — only the
      # affected subgraph re-runs. Supabase env defaults come from
      # test/setup.ts (identical values the old inline env block set).
      # VITEST_MAX_FORKS caps each vitest instance's fork pool: 4 turbo tasks
      # x default forks(=cores) would oversubscribe the 4-vCPU runner.
      - name: Test
        env:
          VITEST_MAX_FORKS: "2"
        run: pnpm exec turbo run test test:scripts --concurrency=4

      # Second save under a distinct key so TEST task results persist too —
      # the post-Build save above can't be re-written (cache keys are
      # immutable) and without this every run re-executes all test tasks.
      # The prefix restore-key picks the newest cache, which after a full
      # green run is this one.
      - name: Save turbo cache (with test results)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}-tested

      # RLS coverage guard (Phase 0.3). Soft-skips when no Supabase DB is
      # running — this job has none today, so it is a no-op until a migrated
      # DB is added to CI, at which point it starts enforcing tenant-scoped
      # RLS. Runnable locally (`pnpm check:rls-coverage`) against the dev DB.
      - name: RLS coverage guard
        run: pnpm check:rls-coverage
